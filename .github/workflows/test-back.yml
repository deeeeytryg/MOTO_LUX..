# Corre las pruebas del backend contra un Postgres temporal en cada push o PR que toque back/.
name: Test back

on:
  push:
    branches: [main]
    paths: ['back/**', '.github/workflows/test-back.yml']
  pull_request:
    paths: ['back/**']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: back/package-lock.json
      - run: npm ci
      - run: npm test
