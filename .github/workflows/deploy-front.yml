# Publica el frontend (carpeta front/) en GitHub Pages en cada push a main que toque front/.
# Requisitos (una sola vez):
#   Settings → Pages → Source: "GitHub Actions"
#   Settings → Secrets and variables → Actions → Variables → VITE_API_URL = URL del backend (sin "/" final)
name: Deploy front

on:
  push:
    branches: [main]
    paths: ['front/**', '.github/workflows/deploy-front.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: front/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: front/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
